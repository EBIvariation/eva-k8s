# Shared GitLab CI build/deploy templates for EVA webservices.
#
# Consuming repos should:
#   include:
#     - remote: 'https://raw.githubusercontent.com/EBIvariation/eva-k8s/refs/tags/<pinned tag, e.g. v1.0>/gitlab-ci/webservice.yml'
#       # bump the tag in this URL deliberately to adopt a template update
#
# and then declare their own jobs extending .build_docker / .update_and_deploy, e.g.:
#
#   build:docker:dev:
#     extends: .build_docker
#     ...
#
#   deploy-to-cluster:dev:
#     extends: .update_and_deploy
#     ...
variables:
  KUBECONFIG_FILE_DEV: https://api.github.com/repos/EBIvariation/configuration/contents/kubernetes-clusters/development-k8s-team-admin-conf.conf
  KUBECONFIG_FILE_STAGING: https://api.github.com/repos/EBIvariation/configuration/contents/kubernetes-clusters/staging-k8s-team-admin-conf.conf
  KUBECONFIG_FILE_PROD: https://api.github.com/repos/EBIvariation/configuration/contents/kubernetes-clusters/production-k8s-team-admin-conf.conf
  KUBECONFIG_FILE_PROD_FALLBACK: https://api.github.com/repos/EBIvariation/configuration/contents/kubernetes-clusters/production-fallback-k8s-team-admin-conf.conf

.build_docker:
  stage: build
  image: docker:latest
  # Serialise builds of the same service+commit so the pull-then-build promotion below can't have both jobs miss the
  # pull and rebuild independently.
  resource_group: build-${SERVICE_NAME}-${CI_COMMIT_SHORT_SHA}
  services:
    - name: docker:dind
      alias: docker
      command: ["--storage-driver=overlay2", "--insecure-registry=localhost"]
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - echo "Waiting for Docker daemon to be ready..."
    - docker info
  script:
    # An image for this exact service+commit may already have been built and pushed by another
    # environment's pipeline: promote it instead of rebuilding. The tag is scoped by SERVICE_NAME because
    # some repos push several services to the same IMAGE_REPOSITORY
    # For example, eva-ws's eva-server/eva-release/count-stats/dgva-server all share ebivariation/eva-ws)
    - |
      CANONICAL_TAG="${SERVICE_NAME}-${CI_COMMIT_SHORT_SHA}"
      if docker pull "$IMAGE_REPOSITORY:$CANONICAL_TAG"; then
        echo "Image for $SERVICE_NAME@$CI_COMMIT_SHORT_SHA already exists - promoting it instead of rebuilding"
        docker tag "$IMAGE_REPOSITORY:$CANONICAL_TAG" "$IMAGE_REPOSITORY:$IMAGE_TAG"
      else
        echo "No existing image for $SERVICE_NAME@$CI_COMMIT_SHORT_SHA - building from scratch"
        docker build -f "${DOCKERFILE_PATH:-Dockerfile}" -t "$IMAGE_REPOSITORY:$IMAGE_TAG" -t "$IMAGE_REPOSITORY:$CANONICAL_TAG" .
        docker push "$IMAGE_REPOSITORY:$CANONICAL_TAG"
        # Only move the latest tag for a genuinely new image. Latest tag will look like eva-seqcol-latest
        docker tag "$IMAGE_REPOSITORY:$CANONICAL_TAG" "$IMAGE_REPOSITORY:${SERVICE_NAME}-latest"
        docker push "$IMAGE_REPOSITORY:${SERVICE_NAME}-latest"
      fi
    - docker push $IMAGE_REPOSITORY:$IMAGE_TAG

.update_and_deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache git curl python3 kubectl
    - python3 -m venv $HOME/.venv
    - source $HOME/.venv/bin/activate
    - git config --global user.email "gitlab-ci@ebi.ac.uk"
    - git config --global user.name "GitLab CI"
    - git config --global credential.helper store
    # Clone eva-k8s for scripts and manifests
    - git clone --depth 1 "https://github.com/EBIvariation/eva-k8s.git" k8s-repo
    - cd k8s-repo
    - pip install --no-cache-dir lxml retry cached-property pyyaml requests
    - pip install --no-dependencies -r scripts/requirements.txt
    - echo "https://${GITHUB_TOKEN}:x-oauth-basic@github.com" > ~/.git-credentials
    - mkdir -p ~/.kube
    # Download kubernetes cluster configuration from private repository
    - curl -u $GITHUB_USER:$GITHUB_TOKEN -H "Accept:application/vnd.github.raw" $KUBECONFIG_FILE > ~/.kube/config
    - chmod 600 ~/.kube/config
  script:
    # Create the target namespace if it doesn't already exist (always run - idempotent).
    # namespace.yaml lives in base not in the overlay.
    - kubectl apply -f $K8S_MANIFEST_PATH/../../base/namespace.yaml
    # Create/update the image pull secret in the target namespace from DOCKER_AUTH_CONFIG. It only
    # updates if DOCKER_AUTH_CONFIG changes
    # SERVICE_NAME is used as the namespace which mean it will be the same for all clusters (dev/staging/prod)
    - kubectl create secret generic regcred --type=kubernetes.io/dockerconfigjson --from-literal=.dockerconfigjson="$DOCKER_AUTH_CONFIG" -n $SERVICE_NAME --dry-run=client -o yaml | kubectl apply -f -
    - source $HOME/.venv/bin/activate
    # Download Maven settings from private repository
    - curl -u $GITHUB_USER:$GITHUB_TOKEN -H "Accept:application/vnd.github.raw" "https://api.github.com/repos/EBIvariation/configuration/contents/eva-maven-settings.xml" > maven-settings.xml
    # Convert Maven settings to application.properties
    - python scripts/maven-settings-to-properties.py --maven_file maven-settings.xml --property_set "${PROPERTY_SET:-$SERVICE_NAME}" --profile $MAVEN_PROFILE --output application.properties
    # Update image tag in kustomization, commit, and push with a fetch+retry loop.
    # Concurrent deploy jobs can push to eva-k8s:main at the same time; a rejected
    # push just means someone else landed first, so re-fetch main and redo the tag
    # bump.
    - |
      ENV_NAME="$(basename "$K8S_MANIFEST_PATH")"
      MAX_ATTEMPTS=5
      attempt=1
      while true; do
        python scripts/update-image-tag.py "$K8S_MANIFEST_PATH/kustomization.yaml" "${IMAGE_TAG}"
        git add "$K8S_MANIFEST_PATH/kustomization.yaml"
        if git diff --cached --quiet; then
          echo "No image tag change to commit"
          break
        fi
        git commit -m "Update $SERVICE_NAME ${ENV_NAME} image tag to ${IMAGE_TAG}"
        if git push origin main; then
          echo "Pushed image tag update on attempt $attempt"
          break
        fi
        if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
          echo "Failed to push image tag update after $MAX_ATTEMPTS attempts"
          exit 1
        fi
        echo "Push rejected (likely a concurrent deploy job) - retrying (attempt $attempt/$MAX_ATTEMPTS)"
        sleep $(( (RANDOM % 5) + 1 ))
        git fetch --depth 1 origin main
        git reset --hard FETCH_HEAD
        attempt=$((attempt + 1))
      done

    # Copy the application.properties where it is expected
    - cp -vf application.properties $K8S_MANIFEST_PATH/

    # Deploy to cluster
    - kubectl apply -k $K8S_MANIFEST_PATH
    - kubectl rollout status deployment/$SERVICE_NAME -n $SERVICE_NAME --timeout=5m
  environment:
    kubernetes:
      namespace: $SERVICE_NAME
