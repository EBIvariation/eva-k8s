apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eva-web
  labels:
    app: eva-web
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  rules:
  - host: eva-web.example.com  # Replace with your actual hostname
    http:
      paths:
      # eva-web is served under an /eva prefix. The full path is proxied through
      # unchanged (no rewrite-target) - the container serves a real "eva/"
      # directory matching it (see eva-web's Dockerfile),
      - path: /eva
        pathType: Prefix
        backend:
          service:
            name: eva-web
            port:
              number: 8080