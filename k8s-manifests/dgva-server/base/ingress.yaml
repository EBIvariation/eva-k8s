apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dgva-server
  labels:
    app: dgva-server
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  rules:
  - host: dgva-server.example.com  # Replace with your actual hostname
    http:
      paths:
      - path: /dgva
        pathType: Prefix
        backend:
          service:
            name: dgva-server
            port:
              number: 8080
