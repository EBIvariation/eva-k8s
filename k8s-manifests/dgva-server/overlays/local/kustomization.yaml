apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dgva-server-local

resources:
- namespace.yaml
- oracle.yaml
- ../../base

# Patch the base deployment for local testing
patches:
- path: deployment-patch.yaml
- path: service-patch.yaml
# Skip ingress and base secrets for local testing
- target:
    group: networking.k8s.io
    version: v1
    kind: Ingress
    name: dgva-server
  patch: |
    - op: replace
      path: /spec/rules/0/host
      value: localhost

# Use local image
images:
- name: ebivariation/dgva-server
  newName: dgva-server
  newTag: local

# Generate secret with application.properties for local testing
secretGenerator:
- name: dgva-server-config
  files:
  - application.properties
