apiVersion: apps/v1
kind: Deployment
metadata:
  name: dgva-server
spec:
  replicas: 1  # Single replica for development
  template:
    spec:
      containers:
      - name: dgva-server
        image: dockerhub.ebi.ac.uk/ebivariation/eva-ws
        imagePullPolicy: Always
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
