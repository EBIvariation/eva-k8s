apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This is the default kustomization that applies the base configuration.
# For environment-specific deployments, use the overlays instead:
#
# Local development (with a local MongoDB):
#   kubectl apply -k vcf-dumper-ws/overlays/local
#
# Development environment:
#   kubectl apply -k vcf-dumper-ws/overlays/dev
#
# To add a new environment, create a new overlay directory under overlays/

resources:
- base
