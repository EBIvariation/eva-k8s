apiVersion: apps/v1
kind: Deployment
metadata:
  name: contig-alias
spec:
  replicas: 1  # FIXME: Contig alias uses a job queue, not safe with >1 replica
  template:
    spec:
      containers:
      - name: contig-alias
        image: dockerhub.ebi.ac.uk/ebivariation/contig-alias
        imagePullPolicy: Always
        env:
        # Outbound HTTP(S)/FTP proxy for reaching internet.
        - name: JAVA_TOOL_OPTIONS
          value: >-
            -Dhttp.proxyHost=hh-wwwcache.ebi.ac.uk -Dhttp.proxyPort=3128
            -Dhttps.proxyHost=hh-wwwcache.ebi.ac.uk -Dhttps.proxyPort=3128
            -Dftp.proxyHost=hh-wwwcache.ebi.ac.uk -Dftp.proxyPort=3128
            -Dhttp.nonProxyHosts=localhost|127.*|*.cluster.local
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
