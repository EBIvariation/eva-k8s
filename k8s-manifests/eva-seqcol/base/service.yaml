apiVersion: v1
kind: Service
metadata:
  name: eva-seqcol
  labels:
    app: eva-seqcol
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8081
    targetPort: 8081
    protocol: TCP
  - name: management
    port: 9090
    targetPort: management
    protocol: TCP
  selector:
    app: eva-seqcol
