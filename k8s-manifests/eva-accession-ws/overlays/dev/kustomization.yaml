apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: eva-accession-ws
resources:
- ../../base
# Monitored service: restrict the management port and opt in to scraping
components:
- ../../../eva-monitoring/service-component
patches:
- path: deployment-patch.yaml
- path: ingress-patch.yaml
images:
- name: dockerhub.ebi.ac.uk/ebivariation/eva-accession
  newTag: eva-accession-ws-dev-2a9ce184
secretGenerator:
- name: eva-accession-ws-config
  files:
  - application.properties
