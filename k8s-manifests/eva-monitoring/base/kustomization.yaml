apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Monitoring shared by every EVA service: one scrape configuration, one set of alert rules and one alert route
# per cluster. Deployed by the pipeline in .gitlab-ci.yml at the root of this repository.

namespace: eva-monitoring

resources:
- servicemonitor.yaml
- prometheusrule.yaml
- alertmanagerconfig.yaml

# monitoring.env is generated at deploy time in this directory.

# The Secret holds the credentials Prometheus uses to scrape the actuators (the username and password keys).
# The name must stay stable because the ServiceMonitor refers to it.
secretGenerator:
- name: actuator-credentials
  envs:
  - monitoring.env
  options:
    disableNameSuffixHash: true

# Only used as the source of the replacements below (to, from, smarthost): the local-config annotation keeps the
# ConfigMap itself out of the cluster.
configMapGenerator:
- name: alerting
  envs:
  - monitoring.env
  options:
    annotations:
      config.kubernetes.io/local-config: "true"

replacements:
- source: {kind: ConfigMap, name: alerting, fieldPath: data.to}
  targets:
  - select: {kind: AlertmanagerConfig, name: eva-services}
    fieldPaths: [spec.receivers.0.emailConfigs.0.to]
- source: {kind: ConfigMap, name: alerting, fieldPath: data.from}
  targets:
  - select: {kind: AlertmanagerConfig, name: eva-services}
    fieldPaths: [spec.receivers.0.emailConfigs.0.from]
- source: {kind: ConfigMap, name: alerting, fieldPath: data.smarthost}
  targets:
  - select: {kind: AlertmanagerConfig, name: eva-services}
    fieldPaths: [spec.receivers.0.emailConfigs.0.smarthost]
