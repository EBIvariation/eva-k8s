apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: eva-services
spec:
  # Alertmanager only applies this route to alerts whose namespace label is the namespace of this resource,
  # which is why every rule in prometheusrule.yaml sets namespace to eva-monitoring. Within those, the
  # notification label chooses the receiver: this route takes the alerts labelled eva-services-email.
  route:
    receiver: email
    matchers:
    - name: notification
      value: eva-services-email
      matchType: "="
    groupBy:
    - alertname
    - eva_service
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h
  receivers:
  - name: email
    emailConfigs:
    # Placeholders: kustomization.yaml replaces the addresses and the mail server with the values of monitoring.env,
    # generated at deploy time from the Maven settings
    - to: alerts@example.org
      from: noreply@example.org
      smarthost: smtp.example.org:25
      requireTLS: false
      sendResolved: true
      headers:
      # Replaced in each overlay to name the environment
      - key: Subject
        value: '{{ template "email.default.subject" . }}'
