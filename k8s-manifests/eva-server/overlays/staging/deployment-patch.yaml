apiVersion: apps/v1
kind: Deployment
metadata:
  name: eva-server
spec:
  replicas: 3  # 1 replica per node across the 3-node staging cluster
  template:
    spec:
      containers:
      - name: eva-server
        image: dockerhub.ebi.ac.uk/ebivariation/eva-ws
        imagePullPolicy: Always
        resources:
          requests:
            memory: "2Gi"
            cpu: "250m"
          limits:
            memory: "3Gi"
            cpu: "500m"
