apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eva-submission-ws
  annotations:
    # The ingress controller does not enable use-forwarded-headers, so it sends X-Forwarded-Proto: http
    # even though clients reach us over https via the EBI front proxy. That value cannot be overridden from a
    # snippet: a second proxy_set_header sends both values (Spring uses the first), and
    # "set $pass_access_scheme" is reset by the controller's rewrite_by_lua_block.
    # Instead send an RFC 7239 Forwarded header, which Spring (server.forward-headers-strategy=framework)
    # uses in preference to X-Forwarded-*, so generated URLs (e.g. the Swagger "servers" entry) are https.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Forwarded "proto=https;host=$host";
spec:
  rules:
  - host: wwwint.ebi.ac.uk
    http:
      paths:
      - path: /eva/webservices/submission-ws
        pathType: Prefix
        backend:
          service:
            name: eva-submission-ws
            port:
              number: 8080
