apiVersion: v1
kind: Service
metadata:
  name: eva-submission-ws
  labels:
    app: eva-submission-ws
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: management
    port: 9090
    targetPort: management
    protocol: TCP
  selector:
    app: eva-submission-ws
