apiVersion: v1
kind: Service
metadata:
  name: count-stats
  labels:
    app: count-stats
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: management
    port: 9090
    targetPort: management
    protocol: TCP
  selector:
    app: count-stats
